name: Agent Work Pilot

on:
  pull_request:
    branches: [explore/governed-agent-app, main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  python-pilot:
    name: Python pilot authorization and persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated gateway tests
        working-directory: reference-apps/agent-work
        run: python -m unittest discover -s tests -v
      - name: Live GitHub read-only source probe
        working-directory: reference-apps/agent-work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from github_source import GitHubSource
          from control import Denied
          token=os.environ["GITHUB_TOKEN"]
          self_repo="toasterman234/temper"
          connected=GitHubSource(self_repo,token=token)
          pr=connected.pull(self_repo,2)
          assert pr["number"]==2 and pr["repo"]==self_repo, pr
          summary=["# Agent Work GitHub read-only probe","",
                   f"- Temper PR #2: read OK; state={pr['state']}; draft={pr['draft']}"]
          try:
              source=GitHubSource("toasterman234/master-repo-0.1",token=token)
              issue=source.issue("toasterman234/master-repo-0.1",76)
              summary.append(f"- master-repo-0.1 issue #76: accessible; state={issue['state']}")
          except Denied as e:
              summary.append(f"- master-repo-0.1 issue #76: NOT accessible to this repository-scoped token ({e.reason})")
              summary.append("- If master-repo is private, use a fine-grained read-only GitHub App/PAT token at runtime.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(summary)+"\n")
          print("\n".join(summary))
          PY

  temper-spec:
    name: Temper native model tests
    runs-on: ubuntu-latest
    needs: python-pilot
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-08
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Temper cascade, Cedar and IOA decision tests
        run: cargo test -p agent-work-reference
      - name: Build native guard executable
        run: cargo build -p agent-work-reference --bin work_guard
      - name: HTTP tests through actual Temper policy gate
        working-directory: reference-apps/agent-work
        env:
          WORK_GUARD_BIN: ${{ github.workspace }}/target/debug/work_guard
        run: python3 -m unittest discover -s tests -v
