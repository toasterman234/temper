name: Agent Work Pilot

on:
  push:
    branches: [work/agent-work-pilot]
  pull_request:
    branches: [explore/governed-agent-app, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-pilot:
    name: Python pilot authorization and persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated gateway tests
        working-directory: reference-apps/agent-work
        run: python -m unittest discover -s tests -v

  temper-spec:
    name: Temper native model tests
    runs-on: ubuntu-latest
    needs: python-pilot
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-08
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Temper cascade and simulation
        run: cargo test -p agent-work-reference --test temper_work
